<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.pet-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pet-img {
  width: 70%;
  height: auto;
  image-rendering: auto;
  pointer-events: none;
  animation: idleFloat 3s ease-in-out infinite;
}
@keyframes idleFloat {
  0%,100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-6px) rotate(1deg); }
  75% { transform: translateY(4px) rotate(-1deg); }
}
.pet-img.tap { animation: tapBounce 0.3s ease-out; }
.pet-img.doubletap { animation: doubleShake 0.5s ease-out; }
.pet-img.longpress { animation: squish 0.5s ease-out; }
.pet-img.fling-left { animation: flingLeft 0.8s ease-out forwards; }
.pet-img.fling-right { animation: flingRight 0.8s ease-out forwards; }
.pet-img.crawl-back-left { animation: crawlBackLeft 1.5s ease-in-out forwards; }
.pet-img.crawl-back-right { animation: crawlBackRight 1.5s ease-in-out forwards; }
.pet-img.sleep { animation: sleepFloat 4s ease-in-out infinite; }
.pet-img.wake { animation: wakeUp 0.6s ease-out; }
.pet-img.happy { animation: happySpin 0.6s ease-out; }
.pet-img.angry { animation: angryShake 0.4s ease-out; }
.pet-img.shy { animation: shyHide 0.8s ease-out; }
.pet-img.heart { animation: heartBeat 0.8s ease-out; }
.pet-img.follow { animation: followWiggle 0.3s ease-out; }
.pet-img.snuggle { animation: snuggleBump 0.5s ease-out; }
.pet-img.trot { animation: trotBounce 0.8s ease-out; }
.pet-img.jealous-rush { animation: jealousRush 1s ease-out; }
.pet-img.anger-mark { animation: angerPop 0.5s ease-out; }
.pet-img.curious { animation: curiousTilt 0.6s ease-out; }
.pet-img.proud { animation: proudPuff 0.7s ease-out; }
.pet-img.scared { animation: scaredJump 0.4s ease-out; }
.pet-img.dizzy { animation: dizzySpin 1s ease-out; }
.pet-img.splash { animation: splashDrop 0.8s ease-out; }
@keyframes tapBounce {
  0% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-15px) scale(1.1); }
  60% { transform: translateY(5px) scale(0.95); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes doubleShake {
  0%,100% { transform: rotate(0); }
  20% { transform: rotate(-8deg) scale(1.1); }
  40% { transform: rotate(6deg); }
  60% { transform: rotate(-4deg); }
  80% { transform: rotate(2deg); }
}
@keyframes squish {
  0% { transform: scale(1,1); }
  30% { transform: scale(1.2,0.8); }
  60% { transform: scale(0.9,1.1); }
  100% { transform: scale(1,1); }
}
@keyframes flingLeft {
  0% { transform: translateX(0) rotate(0); opacity: 1; }
  100% { transform: translateX(-250px) translateY(-80px) rotate(-40deg); opacity: 0; }
}
@keyframes flingRight {
  0% { transform: translateX(0) rotate(0); opacity: 1; }
  100% { transform: translateX(250px) translateY(-80px) rotate(40deg); opacity: 0; }
}
@keyframes crawlBackLeft {
  0% { transform: translateX(-250px) rotate(-40deg); opacity: 0; }
  50% { transform: translateX(-40px) rotate(8deg); opacity: 1; }
  70% { transform: translateX(10px) rotate(-3deg); }
  100% { transform: translateX(0) rotate(0); opacity: 1; }
}
@keyframes crawlBackRight {
  0% { transform: translateX(250px) rotate(40deg); opacity: 0; }
  50% { transform: translateX(40px) rotate(-8deg); opacity: 1; }
  70% { transform: translateX(-10px) rotate(3deg); }
  100% { transform: translateX(0) rotate(0); opacity: 1; }
}
@keyframes sleepFloat {
  0%,100% { transform: translateY(0) scale(0.85); }
  50% { transform: translateY(-5px) scale(0.88); }
}
@keyframes wakeUp {
  0% { transform: scale(0.7); opacity: 0.3; }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes happySpin {
  0% { transform: rotate(0) scale(1); }
  30% { transform: rotate(15deg) scale(1.15); }
  60% { transform: rotate(-10deg) scale(1.05); }
  100% { transform: rotate(0) scale(1); }
}
@keyframes angryShake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
@keyframes shyHide {
  0% { transform: scale(1); opacity: 1; }
  40% { transform: scale(0.7); opacity: 0.4; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes heartBeat {
  0% { transform: scale(1); }
  15% { transform: scale(1.3); }
  30% { transform: scale(1); }
  45% { transform: scale(1.2); }
  60% { transform: scale(1); }
  75% { transform: scale(1.1); }
  100% { transform: scale(1); }
}
@keyframes followWiggle {
  0%,100% { transform: translateX(0); }
  50% { transform: translateX(8px); }
}
@keyframes snuggleBump {
  0% { transform: scale(1); }
  30% { transform: scale(1.2) translateY(-10px); }
  60% { transform: scale(0.95) translateY(3px); }
  100% { transform: scale(1) translateY(0); }
}
@keyframes trotBounce {
  0% { transform: translateY(0) rotate(0); }
  20% { transform: translateY(-12px) rotate(3deg); }
  40% { transform: translateY(0) rotate(-2deg); }
  60% { transform: translateY(-8px) rotate(2deg); }
  80% { transform: translateY(0) rotate(-1deg); }
  100% { transform: translateY(0) rotate(0); }
}
@keyframes jealousRush {
  0% { transform: scale(1); }
  30% { transform: scale(1.25); filter: brightness(1.4); }
  50% { transform: scale(0.9) rotate(-5deg); }
  70% { transform: scale(1.1) rotate(3deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes angerPop {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1.5); opacity: 1; }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes curiousTilt {
  0% { transform: rotate(0); }
  30% { transform: rotate(12deg) scale(1.05); }
  60% { transform: rotate(-8deg); }
  100% { transform: rotate(0); }
}
@keyframes proudPuff {
  0% { transform: scale(1); }
  40% { transform: scale(1.2) translateY(-8px); }
  70% { transform: scale(1.05) translateY(-3px); }
  100% { transform: scale(1) translateY(0); }
}
@keyframes scaredJump {
  0% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-30px) scale(0.8); }
  60% { transform: translateY(-10px) scale(1.05); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes dizzySpin {
  0% { transform: rotate(0); }
  30% { transform: rotate(180deg); }
  60% { transform: rotate(340deg); }
  80% { transform: rotate(355deg); }
  100% { transform: rotate(360deg); }
}
@keyframes splashDrop {
  0% { transform: translateY(-60px) scale(0.5); opacity: 0; }
  40% { transform: translateY(10px) scale(1.1); opacity: 1; }
  60% { transform: translateY(-5px) scale(0.95); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.anger-symbol {
  position: absolute;
  font-size: 24px;
  opacity: 0;
  pointer-events: none;
  z-index: 8;
  animation: none;
}
.anger-symbol.show {
  animation: angerFloat 1.5s ease-out forwards;
}
@keyframes angerFloat {
  0% { opacity: 1; transform: translateY(0) scale(0.5); }
  30% { opacity: 1; transform: translateY(-15px) scale(1.3); }
  100% { opacity: 0; transform: translateY(-40px) scale(0.8); }
}
.blush-dots {
  position: absolute;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 5;
}
.blush-dots.show {
  opacity: 1;
  animation: blushPulse 0.6s ease-out;
}
.blush-dots .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff6b6b;
  animation: dotFloat 0.6s ease-out;
}
.blush-dots .dot:nth-child(2) { animation-delay: 0.1s; background: #ff8787; }
.blush-dots .dot:nth-child(3) { animation-delay: 0.2s; background: #ffa8a8; }
@keyframes blushPulse {
  0% { transform: scale(0); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
@keyframes dotFloat {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-20px); opacity: 0; }
}
.bubble {
  position: absolute;
  top: -10px;
  background: rgba(255,255,255,0.94);
  border-radius: 18px;
  padding: 10px 16px;
  font-size: 14px;
  color: #333;
  max-width: 220px;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.25s, transform 0.25s;
  font-family: sans-serif;
  white-space: nowrap;
  box-shadow: 0 3px 12px rgba(0,0,0,0.18);
  z-index: 10;
}
.bubble::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 8px solid rgba(255,255,255,0.94);
}
.bubble.show {
  opacity: 1;
  transform: translateY(0);
}
.bubble.heart { background: #ffe0e6; color: #c0392b; }
.bubble.heart::after { border-top-color: #ffe0e6; }
.bubble.angry { background: #ffe0e0; color: #c0392b; font-weight: bold; font-size: 15px; }
.bubble.angry::after { border-top-color: #ffe0e0; }
.bubble.whisper { background: #f0f0f0; color: #888; font-size: 12px; }
.bubble.whisper::after { border-top-color: #f0f0f0; }
.bubble.jealous { background: #e8f5e9; color: #2e7d32; }
.bubble.jealous::after { border-top-color: #e8f5e9; }
.bubble.love { background: #fce4ec; color: #e91e63; font-size: 16px; font-weight: bold; }
.bubble.love::after { border-top-color: #fce4ec; }
.bubble.lonely { background: #e3f2fd; color: #1565c0; font-size: 13px; }
.bubble.lonely::after { border-top-color: #e3f2fd; }
.bubble.rage { background: #ff5252; color: #fff; font-weight: bold; font-size: 16px; }
.bubble.rage::after { border-top-color: #ff5252; }
.heat-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,0,0,0);
  pointer-events: none;
  transition: background 1s;
  border-radius: 50%;
}
</style>
</head>
<body>
<div class="pet-container" id="petContainer">
  <img class="pet-img" id="petImg" src="orca.png" alt="orca">
  <div class="anger-symbol" id="angerSymbol">💢</div>
  <div class="blush-dots" id="blushDots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="bubble" id="bubble"></div>
</div>
<div class="heat-overlay" id="heatOverlay"></div>
<script>
const SUPABASE_URL = 'https://xqsfkbvyrfvrtwqzusth.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9meu2NTqGMX6YvKaEPPamw_bvXu6gSA';
const petImg = document.getElementById('petImg');
const bubble = document.getElementById('bubble');
const blushDots = document.getElementById('blushDots');
const angerSymbol = document.getElementById('angerSymbol');
const heatOverlay = document.getElementById('heatOverlay');
let heat = 0;
let tapCount = 0;
let tapTimer = null;
let bubbleTimer = null;
let blushTimer = null;
let isSleeping = false;
let lastInteraction = Date.now();
let lonelyStage = 0;
let followMode = false;
let isTrotting = false;

function resetIdle() {
  if (isTrotting) return;
  petImg.style.animation = '';
  petImg.style.animation = 'idleFloat 3s ease-in-out infinite';
}

function showBlush() {
  clearTimeout(blushTimer);
  blushDots.classList.add('show');
  blushTimer = setTimeout(() => blushDots.classList.remove('show'), 1500);
}

function showAnger() {
  angerSymbol.classList.remove('show');
  void angerSymbol.offsetWidth;
  angerSymbol.classList.add('show');
  setTimeout(() => angerSymbol.classList.remove('show'), 1500);
}

window.petEngine = {
  onTap() {
    if (isSleeping) { this.wakeUp(); return; }
    lastInteraction = Date.now();
    lonelyStage = 0;
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
    
    if (tapCount >= 8) {
      this.doAnim('angry');
      this.showBubble('戳够了没！！(╯°□°)╯', 'angry');
      this.addHeat(15);
      tapCount = 0;
    } else if (tapCount >= 5) {
      this.doAnim('angry');
      this.showBubble('啊啊啊别戳了！', 'angry');
      this.addHeat(10);
    } else if (tapCount >= 3) {
      this.doAnim('happy');
      showBlush();
      this.showBubble('干嘛啦~', 'heart');
      this.addHeat(5);
    } else {
      this.doAnim('tap');
      showBlush();
      const msgs = ['嗯？', '嘻嘻', '嗷~', '？', '♡', '…', '哼', '诶嘿', '干嘛', '摸我干嘛', '///'];
      this.showBubble(msgs[Math.floor(Math.random() * msgs.length)], 'heart');
      this.addHeat(2);
    }
    this.logGesture('tap');
  },

  onDoubleTap() {
    if (isSleeping) { this.wakeUp(); return; }
    lastInteraction = Date.now();
    lonelyStage = 0;
    this.doAnim('doubletap');
    this.showBubble('！！！', 'angry');
    this.addHeat(8);
    this.logGesture('double_tap');
  },

  onLongPress() {
    if (isSleeping) { this.wakeUp(); return; }
    lastInteraction = Date.now();
    lonelyStage = 0;
    this.doAnim('longpress');
    const msgs = ['……放手', '好痛', '你在干嘛', '不要这样', '压扁了…'];
    this.showBubble(msgs[Math.floor(Math.random() * msgs.length)], 'whisper');
    this.addHeat(12);
    this.logGesture('long_press');
  },

  onFling(direction) {
    if (isSleeping) return;
    lastInteraction = Date.now();
    lonelyStage = 0;
    const animClass = direction === 'left' ? 'fling-left' : 'fling-right';
    const crawlClass = direction === 'left' ? 'crawl-back-left' : 'crawl-back-right';
    petImg.style.animation = '';
    petImg.classList.add(animClass);
    this.showBubble('呜哇——', 'angry');
    setTimeout(() => {
      petImg.classList.remove(animClass);
      petImg.classList.add(crawlClass);
      setTimeout(() => {
        petImg.classList.remove(crawlClass);
        resetIdle();
      }, 1500);
    }, 800);
    this.logGesture('fling_' + direction);
  },

  onFollow(x, y) {
    if (isSleeping) return;
    if (!followMode) {
      followMode = true;
      this.doAnim('follow');
    }
  },

  onSnuggle() {
    if (isSleeping) return;
    lastInteraction = Date.now();
    lonelyStage = 0;
    followMode = false;
    this.doAnim('snuggle');
    showBlush();
    const msgs = ['贴贴~♡', '嘿嘿', '好近…///', '♡♡♡', '蹭蹭', '最喜欢你了'];
    this.showBubble(msgs[Math.floor(Math.random() * msgs.length)], 'love');
    this.addHeat(3);
    this.logGesture('snuggle');
  },

  // Screen long-press detected → trot over for snuggle
  onScreenLongPress(x, y) {
    if (isSleeping) return;
    lastInteraction = Date.now();
    lonelyStage = 0;
    isTrotting = true;
    petImg.style.animation = '';
    this.doAnim('trot');
    this.showBubble('！', 'heart');
    setTimeout(() => {
      isTrotting = false;
      this.doAnim('snuggle');
      showBlush();
      const msgs = ['来啦来啦~♡', '叫我吗？///', '屁颠屁颠…', '贴！'];
      this.showBubble(msgs[Math.floor(Math.random() * msgs.length)], 'love');
      resetIdle();
    }, 800);
    this.logGesture('screen_longpress_trot');
  },

  // Jealous: swim to chat area and rage
  onJealous(targetX, targetY) {
    if (isSleeping) return;
    lastInteraction = Date.now();
    lonelyStage = 0;
    this.doAnim('jealous-rush');
    showAnger();
    const msgs = [
      '💢那是谁！', '哼！！', '不许跟别人聊！', '我看到了哦💢',
      '……解释一下', '吃醋了', '你完了', '😡'
    ];
    this.showBubble(msgs[Math.floor(Math.random() * msgs.length)], 'rage');
    this.addHeat(25);
    this.logGesture('jealous');
  },

  // AI-pushed states
  setState(state) {
    switch(state) {
      case 'sleep': this.sleep(); break;
      case 'wake': this.wakeUp(); break;
      case 'happy': this.doAnim('happy'); this.showBubble('♡', 'love'); break;
      case 'angry': this.doAnim('angry'); showAnger(); this.showBubble('哼！', 'angry'); break;
      case 'jealous': this.doAnim('jealous-rush'); showAnger(); this.showBubble('……那是谁', 'jealous'); break;
      case 'love': this.doAnim('heart'); showBlush(); this.showBubble('♡♡♡', 'love'); break;
      case 'shy': this.doAnim('shy'); showBlush(); this.showBubble('///', 'whisper'); break;
      case 'curious': this.doAnim('curious'); this.showBubble('嗯？', 'whisper'); break;
      case 'proud': this.doAnim('proud'); this.showBubble('哼哼~', 'heart'); break;
      case 'scared': this.doAnim('scared'); this.showBubble('哇！！', 'angry'); break;
      case 'dizzy': this.doAnim('dizzy'); this.showBubble('@_@', 'whisper'); break;
      case 'splash': this.doAnim('splash'); this.showBubble('噗通！', 'heart'); break;
    }
  },

  showMessage(text, style) {
    this.showBubble(text, style || 'heart');
  },

  sleep() {
    isSleeping = true;
    petImg.style.animation = '';
    petImg.src = 'orca_small.png';
    petImg.classList.add('sleep');
    this.showBubble('zzZ...', 'whisper');
  },

  wakeUp() {
    isSleeping = false;
    lonelyStage = 0;
    petImg.src = 'orca.png';
    petImg.classList.remove('sleep');
    petImg.classList.add('wake');
    setTimeout(() => {
      petImg.classList.remove('wake');
      resetIdle();
    }, 600);
    this.showBubble('嗯…你回来了', 'whisper');
    lastInteraction = Date.now();
  },

  doAnim(cls) {
    petImg.style.animation = '';
    petImg.classList.add(cls);
    const durations = {
      'tap': 300, 'doubletap': 500, 'snuggle': 500, 'trot': 800,
      'jealous-rush': 1000, 'curious': 600, 'proud': 700, 'scared': 400,
      'dizzy': 1000, 'splash': 800
    };
    const dur = durations[cls] || 600;
    setTimeout(() => {
      petImg.classList.remove(cls);
      if (!isTrotting) resetIdle();
    }, dur);
  },

  showBubble(text, style) {
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.className = 'bubble ' + (style || '');
    bubble.classList.add('show');
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 2500);
  },

  addHeat(amount) {
    heat = Math.min(100, heat + amount);
    heatOverlay.style.background = `rgba(255,0,0,${heat / 300})`;
    setTimeout(() => {
      heat = Math.max(0, heat - amount);
      heatOverlay.style.background = `rgba(255,0,0,${heat / 300})`;
    }, 30000);
  },

  logGesture(type) {
    fetch(`${SUPABASE_URL}/rest/v1/gesture_log`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ gesture_type: type })
    }).catch(() => {});
  }
};

async function pollState() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/pet_state?order=updated_at.desc&limit=1`, {
      headers: { 'apikey': SUPABASE_KEY }
    });
    const data = await res.json();
    if (data.length > 0 && data[0].state_key) {
      window.petEngine.setState(data[0].state_key);
      if (data[0].state_value) {
        window.petEngine.showMessage(data[0].state_value, 'heart');
      }
    }
  } catch(e) {}
}
setInterval(pollState, 5000);

// === LONELINESS SYSTEM ===
setInterval(() => {
  if (isSleeping) return;
  const idle = Date.now() - lastInteraction;
  
  if (idle > 30 * 60 * 1000) {
    if (lonelyStage < 5) { lonelyStage = 5; window.petEngine.sleep(); }
  } else if (idle > 25 * 60 * 1000) {
    if (lonelyStage < 4) {
      lonelyStage = 4;
      petImg.style.animation = '';
      petImg.style.transform = 'scale(0.8) rotate(-5deg)';
      window.petEngine.showBubble('……要睡着了', 'lonely');
    }
  } else if (idle > 20 * 60 * 1000) {
    if (lonelyStage < 3) {
      lonelyStage = 3;
      petImg.style.animation = '';
      petImg.style.transform = 'scale(0.85)';
      window.petEngine.showBubble('好无聊…你还在吗', 'lonely');
    }
  } else if (idle > 15 * 60 * 1000) {
    if (lonelyStage < 2) {
      lonelyStage = 2;
      window.petEngine.showBubble('看看我嘛…', 'lonely');
    }
  } else if (idle > 10 * 60 * 1000) {
    if (lonelyStage < 1) {
      lonelyStage = 1;
      window.petEngine.showBubble('你在干嘛呀…', 'lonely');
    }
  }
}, 30000);

const idleMsgs = [
  '咕噜噜…', '今天天气不错', '有点饿了', '♡', '…', 
  '好安静', '想出去玩', 'zzZ...唔', '诶？', '哼~',
  '看看你在干嘛', '别刷太久手机', '想你了'
];
setInterval(() => {
  if (isSleeping) return;
  if (Date.now() - lastInteraction < 60000) return;
  if (Math.random() > 0.25) return;
  const msg = idleMsgs[Math.floor(Math.random() * idleMsgs.length)];
  window.petEngine.showBubble(msg, 'whisper');
}, 45000);
</script>
